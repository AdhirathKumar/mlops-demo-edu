name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  CDSW_DOMAIN: "https://ml-0087d16c-9a9.maria-56.kfjr-x0dh.cloudera.site"
  PROJ_NAME: "cicd-mlops_5_5356125"
  RUN_TIME: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-workbench-python3.9-standard:2024.02.1-b46125"

jobs:
  deploy-to-cml:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get Project ID
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          RESPONSE=$(curl -s -G "$CDSW_DOMAIN/api/v2/projects" \
            --data-urlencode "search_filter={\"name\":\"$PROJ_NAME\"}" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY")
          PROJECT_ID=$(echo "$RESPONSE" | jq -r '.projects[0].id')
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "Project lookup failed: $RESPONSE"; exit 1
          fi
          echo "Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Create and Run Bootstrap Job
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"cpu\": 2, \"memory\": 4, \"name\": \"bootstrap\", \"runtime_identifier\": \"$RUN_TIME\", \"script\": \"0_bootstrap.py\"}")
          JOB_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Job creation failed: $RESPONSE"; exit 1
          fi
          echo "Job ID: $JOB_ID"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV
          curl -s -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$JOB_ID/runs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json"

      - name: Wait for 30 Seconds
        run: sleep 30

      - name: Create and Run Fit Model Job (Run Experiment)
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"cpu\": 2, \"memory\": 4, \"name\": \"train_experiment\", \"runtime_identifier\": \"$RUN_TIME\", \"script\": \"fit.py\"}")
          EXPERIMENT_JOB_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$EXPERIMENT_JOB_ID" ] || [ "$EXPERIMENT_JOB_ID" = "null" ]; then
            echo "Job creation failed: $RESPONSE"; exit 1
          fi
          echo "Experiment Job ID: $EXPERIMENT_JOB_ID"
          curl -s -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$EXPERIMENT_JOB_ID/runs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json"
